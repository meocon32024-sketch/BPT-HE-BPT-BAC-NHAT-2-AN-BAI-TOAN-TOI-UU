<!doctype html>
<html lang="vi">
  <head>
<style>
  /* 1. Ẩn nút "Tìm Đỉnh Đa Giác" */
  button[title*="Tính toán giao điểm"] {
    display: none !important;
  }

  /* 2. Ẩn form "Nhập đề bài tùy chỉnh hoặc chụp ảnh" */
  form:has(#input-textarea),
  .flex.flex-col.gap-6 > form {
    display: none !important;
  }

  /* 3. Ẩn danh sách "Chọn dạng toán mẫu chuẩn SGK" */
  .flex.flex-col.gap-6 > .flex.flex-col.gap-3:first-child {
    display: none !important;
  }

  /* 4. Ẩn phím / tab "Chụp/Nhập Đề Bằng AI" */
  button:has(svg.lucide-sparkles):not([type="submit"]) {
    display: none !important;
  }
</style>

<!-- 1. BỘ LỌC CSS: ẨN CẢ 3 KHỐI GIAO DIỆN THEO YÊU CẦU               -->

<style>
  /* Ẩn khối 1: Form "Nhập đề bài tùy chỉnh hoặc chụp ảnh" */
  form:has(#input-textarea),
  .flex.flex-col.gap-6 > form {
    display: none !important;
  }

  /* Ẩn khối 2: Danh sách "Chọn dạng toán mẫu chuẩn SGK Toán 10 KNTT" */
  .flex.flex-col.gap-6 > .flex.flex-col.gap-3:first-child {
    display: none !important;
  }

  /* Ẩn khối 3: Phím / Tab "Chụp/Nhập Đề Bằng AI" */
  button:has(svg.lucide-sparkles):not([type="submit"]) {
    display: none !important;
  }

  /* Khóa bôi đen / chọn văn bản trên toàn trang */
  body, * {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
  }

  /* Vẫn cho phép thao tác nhập liệu bình thường trong các ô số hệ số */
  input, textarea {
    -webkit-user-select: text !important;
    user-select: text !important;
  }
</style>

<!-- 2. SCRIPT BẢO VỆ CHỐNG SAO CHÉP & CHỐNG SOI CODE (ANTI-DEVTOOLS) -->
<!-- ================================================================= -->
<script>
  (function () {
    // 1. Chặn chuột phải (Context Menu)
    document.addEventListener("contextmenu", function (e) {
      e.preventDefault();
      return false;
    }, { capture: true });

    // 2. Chặn các tổ hợp phím sao chép, xem nguồn và mở DevTools
    document.addEventListener("keydown", function (e) {
      // F12
      if (e.keyCode === 123) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      const ctrlOrMeta = e.ctrlKey || e.metaKey;

      if (ctrlOrMeta) {
        // Ctrl + U (Xem mã nguồn - View Source)
        // Ctrl + S (Lưu trang web - Save Page)
        // Ctrl + P (In trang - Print)
        // Ctrl + A (Chọn tất cả - Select All)
        if (['u', 's', 'p', 'a', 'U', 'S', 'P', 'A'].includes(e.key)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        // Ctrl + Shift + I / J / C (Mở Developer Tools / Console / Inspect)
        if (e.shiftKey && ['i', 'j', 'c', 'I', 'J', 'C'].includes(e.key)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }
    }, { capture: true });

    // 3. Chặn sự kiện Copy và Cut
    document.addEventListener("copy", function (e) {
      e.preventDefault();
    }, { capture: true });

    document.addEventListener("cut", function (e) {
      e.preventDefault();
    }, { capture: true });

    // 4. Bẫy Debugger chống soi biến và can thiệp Console (Debugger Trap)
    setInterval(function () {
      const startTime = performance.now();
      // Lệnh debugger sẽ tạm dừng thực thi nếu DevTools đang mở
      (function () {}["constructor"]("debugger")());
      const endTime = performance.now();
      // Nếu thời gian chạy lệch quá 100ms, nghĩa là DevTools đang mở
      if (endTime - startTime > 100) {
        document.body.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#ef4444;font-size:18px;font-weight:bold;">
            Hệ thống phát hiện công cụ kiểm tra mã nguồn. Vui lòng tắt DevTools để tiếp tục sử dụng.
          </div>
        `;
      }
    }, 1000);

    // Xóa lịch sử Console định kỳ
    setInterval(function () {
      if (window.console) {
        console.clear();
      }
    }, 2000);
  })();
</script>

  /* 3. Ẩn thanh / phím đen "Chụp/Nhập Đề Bằng AI" */

<!-- BỘ LỌC ẨN NÚT AI VÀ PHẦN BÀI MẪU SGK -->
<style>
  /* 1. Ẩn toàn bộ phần "Chọn dạng toán mẫu chuẩn SGK" */
  .flex.flex-col.gap-6 > .flex.flex-col.gap-3:first-child {
    display: none !important;
  }
</style>

<script>
  (function () {
    const hideAIButton = () => {
      // 2. Ẩn phím / nút "Chụp/Nhập Đề Bằng AI"
      const candidates = document.querySelectorAll("button, a, span, div");
      candidates.forEach((el) => {
        // Chỉ so khớp chính xác cụm từ, tránh quét trúng thẻ cha bao ngoài
        if (el.innerText && el.innerText.trim() === "Chụp/Nhập Đề Bằng AI") {
          const btn = el.closest("button, a, [role='button']") || el;
          btn.style.setProperty("display", "none", "important");
        }
      });
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", hideAIButton);
    } else {
      hideAIButton();
    }

    // Tự động ẩn lại nếu giao diện được React vẽ lại
    const observer = new MutationObserver(hideAIButton);
    observer.observe(document.documentElement, { childList: true, subtree: true });
  })();
</script>

## Bước 1: Vẽ đường thẳng bờ $d$

Vẽ đường thẳng $d: 2x - y = 4$ trên mặt phẳng tọa độ $Oxy$.
- Cho $y = 0 \\Rightarrow 2x = 4 \\Rightarrow x = 2$. Đường thẳng $d$ cắt trục hoành $Ox$ tại điểm $P(2; 0)$.
- Cho $x = 0 \\Rightarrow -y = 4 \\Rightarrow y = -4$. Đường thẳng $d$ cắt trục tung $Oy$ tại điểm $Q(0; -4)$.

> ⚠️ **Quy ước nét vẽ SGK KNTT:** Do bất phương trình có dấu so sánh ngặt "$<$" (không lấy dấu bằng), đường thẳng bờ $d$ phải được vẽ bằng **nét đứt**.

---

## Bước 2: Chọn điểm thử

Chọn gốc tọa độ $O(0; 0)$ làm điểm thử (vì điểm $O$ không nằm trên đường thẳng $d$).
- Thay tọa độ $(0; 0)$ vào vế trái của bất phương trình:
  $$2(0) - (0) = 0$$
- So sánh với vế phải: Ta thấy $0 < 4$ là một khẳng định **ĐÚNG**.

---

## 1. Hệ bất phương trình giới hạn
Xét hệ bất phương trình bậc nhất hai ẩn:
$$\\begin{cases} x + y \\le 5 \\\\ x + 2y \\le 8 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$$

## 2. Biểu diễn miền nghiệm trên mặt phẳng tọa độ $Oxy$
- Vẽ các đường thẳng bờ trên mặt phẳng tọa độ $Oxy$:
  - Đường thẳng $d_1: x + y = 5$ đi qua hai điểm $(5; 0)$ và $(0; 5)$.
  - Đường thẳng $d_2: x + 2y = 8$ đi qua hai điểm $(8; 0)$ và $(0; 4)$.
  - Bờ $x = 0$ là trục tung $Oy$; bờ $y = 0$ là trục hoành $Ox$.
- Lần lượt gạch bỏ các nửa mặt phẳng không phải là miền nghiệm của từng bất phương trình trong hệ.
- Miền nghiệm của hệ là miền không bị gạch trên mặt phẳng tọa độ $Oxy$.

- Đỉnh **$A$**: $(5; 0)$
- Đỉnh **$B$**: $(2; 3)$ (giao điểm của $d_1$ và $d_2$)
- Đỉnh **$C$**: $(0; 4)$`},{id:`sample-3`,title:`3. Bài toán Sản xuất (Tối ưu lợi nhuận)`,subtitle:`Bài toán thực tế kinh điển (SGK Toán 10 KNTT)`,description:`Quy hoạch tuyến tính tối ưu số lượng sản phẩm để đạt doanh thu và lợi nhuận cao nhất.`,prompt:`Một xưởng sản xuất bàn và ghế. Để sản xuất 1 chiếc bàn cần 2 giờ lắp ráp và 1 giờ hoàn thiện. Để sản xuất 1 chiếc ghế cần 1 giờ lắp ráp và 1 giờ hoàn thiện. Tổng số giờ lắp ráp tối đa mỗi tuần là 40 giờ, giờ hoàn thiện tối đa là 25 giờ. Biết một chiếc bàn bán lãi 200.000 đồng, một chiếc ghế bán lãi 150.000 đồng. Hãy lập kế hoạch sản xuất bàn và ghế sao cho tổng số tiền lãi lớn nhất.`,inequalities:[{a:1,b:0,sign:`>=`,c:0,isStrict:!1,label:`x >= 0`},{a:0,b:1,sign:`>=`,c:0,isStrict:!1,label:`y >= 0`},{a:2,b:1,sign:`<=`,c:40,isStrict:!1,label:`d_1: 2x + y = 40`},{a:1,b:1,sign:`<=`,c:25,isStrict:!1,label:`d_2: x + y = 25`}],objectiveFunction:{f_a:200,f_b:150,isMax:!0,symbol:`Lợi nhuận F(x,y)`},vertices:[{x:0,y:0,label:`O`},{x:20,y:0,label:`A`},{x:15,y:10,label:`B`},{x:0,y:25,label:`C`}],suggestedBounds:{xMin:-5,xMax:30,yMin:-5,yMax:35},explanation:`# Bài toán tối ưu sản xuất (Quy hoạch tuyến tính)

Dưới đây là lời giải chi tiết theo đúng các bước phương pháp sư phạm **SGK Toán 10 Kết nối tri thức**:

---

## 1. Thiết lập bài toán toán học
Gọi $x$ là số lượng chiếc bàn xưởng sản xuất trong một tuần ($x \\ge 0$).
Gọi $y$ là số lượng chiếc ghế xưởng sản xuất trong một tuần ($y \\ge 0$).

Các điều kiện giới hạn nguồn lực của xưởng:
- **Thời gian lắp ráp tối đa là 40 giờ:**
  $$2x + y \\le 40$$
- **Thời gian hoàn thiện tối đa là 25 giờ:**
  $$x + y \\le 25$$

Tổng lợi nhuận thu được hàng tuần biểu diễn qua hàm mục tiêu $F(x, y)$ (đơn vị: nghìn đồng):
$$F(x, y) = 200x + 150y$$

Ta cần tìm giá trị lớn nhất của $F(x, y)$ với các điều kiện ràng buộc:
$$\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 2x + y \\le 40 \\\\ x + y \\le 25 \\end{cases}$$

---

## 2. Xác định miền nghiệm của hệ bất phương trình
- $x \\ge 0$: Nửa mặt phẳng bên phải trục tung $Oy$. Gạch bỏ phần $x < 0$.
- $y \\ge 0$: Nửa mặt phẳng phía trên trục hoành $Ox$. Gạch bỏ phần $y < 0$.
- $2x + y \\le 40$: Vẽ đường thẳng $d_1: 2x + y = 40$ (nét liền) đi qua $(20; 0)$ và $(0; 40)$. Thử gốc $O(0; 0)$ thỏa mãn, gạch bỏ phần không chứa $O$.
- $x + y \\le 25$: Vẽ đường thẳng $d_2: x + y = 25$ (nét liền) đi qua $(25; 0)$ và $(0; 25)$. Thử gốc $O(0; 0)$ thỏa mãn, gạch bỏ phần không chứa $O$.

**Kết luận miền nghiệm:** Miền nghiệm của hệ là miền tứ giác lồi **$OABC$** (phần mặt phẳng không bị gạch).

---

## 3. Tọa độ các đỉnh của tứ giác nghiệm $OABC$
- $O(0; 0)$ là gốc tọa độ.
- $A(20; 0)$ là giao điểm của $d_1$ với trục hoành $Ox$.
- $C(0; 25)$ là giao điểm của $d_2$ với trục tung $Oy$.
- $B(15; 10)$ là nghiệm của hệ phương trình giao điểm:
  $$\\begin{cases} 2x + y = 40 \\\\ x + y = 25 \\end{cases} \\Rightarrow \\begin{cases} x = 15 \\\\ y = 10 \\end{cases}$$

---

## 4. Tính giá trị hàm mục tiêu tại các đỉnh

Thay tọa độ các đỉnh của miền tứ giác $OABC$ vào hàm mục tiêu $F(x, y) = 200x + 150y$ (đơn vị: nghìn đồng):

| Đỉnh đa giác | Tọa độ $(x; y)$ | Biểu thức tính $F(x, y)$ | Giá trị $F(x, y)$ (nghìn đồng) |
| :---: | :---: | :--- | :---: |
| **$O$** | $(0; 0)$ | $200(0) + 150(0)$ | $0$ |
| **$A$** | $(20; 0)$ | $200(20) + 150(0)$ | $4,000$ |
| **$C$** | $(0; 25)$ | $200(0) + 150(25)$ | $3,750$ |
| **$B$** | $(15; 10)$ | $200(15) + 150(10)$ | **$4,500$ (Lớn nhất)** |

---

## 5. Kết luận thực tế

Theo định lí đỉnh đa giác, giá trị lớn nhất của $F(x, y)$ bằng **4.500 nghìn đồng** (tức **4.500.000 đồng**) đạt được tại đỉnh **$B(15; 10)$**.

**Đáp án:** Xưởng sản xuất cần làm **15 chiếc bàn** và **10 chiếc ghế** mỗi tuần để đạt lợi nhuận tối đa là **4.500.000 đồng**.`},{id:`sample-4`,title:`4. Bài toán Dinh dưỡng (Tối ưu chi phí)`,subtitle:`Bài toán giảm thiểu chi phí (Minimization)`,description:`Quy hoạch tuyến tính tìm phương án phối hợp khẩu phần ăn có chi phí thấp nhất mà vẫn đảm bảo đủ chất dinh dưỡng.`,prompt:`Một gia đình cần mua ít nhất 900 đơn vị Vitamin A và 600 đơn vị Vitamin B từ hai loại thức ăn X và Y. Biết mỗi kilôgam thức ăn X có chứa 400 đơn vị Vitamin A và 200 đơn vị Vitamin B, giá mua là 10.000 đồng/kg. Mỗi kilôgam thức ăn Y có chứa 300 đơn vị Vitamin A và 300 đơn vị Vitamin B, giá mua là 12.000 đồng/kg. Hỏi cần mua bao nhiêu kilôgam mỗi loại thức ăn X và Y để tổng chi phí mua là nhỏ nhất mà vẫn đủ dinh dưỡng?`,inequalities:[{a:1,b:0,sign:`>=`,c:0,isStrict:!1,label:`x >= 0`},{a:0,b:1,sign:`>=`,c:0,isStrict:!1,label:`y >= 0`},{a:4,b:3,sign:`>=`,c:9,isStrict:!1,label:`d_1: 4x + 3y = 9`},{a:2,b:3,sign:`>=`,c:6,isStrict:!1,label:`d_2: 2x + 3y = 6`}],objectiveFunction:{f_a:10,f_b:12,isMax:!1,symbol:`Chi phí T(x,y)`},vertices:[{x:3,y:0,label:`A`},{x:1.5,y:1,label:`B`},{x:0,y:3,label:`C`}],suggestedBounds:{xMin:-1,xMax:5,yMin:-1,yMax:5},explanation:`# Bài toán khẩu phần dinh dưỡng (Tối ưu hóa chi phí thấp nhất)

Bài toán tìm giá trị nhỏ nhất (Min) của chi phí dựa trên hệ bất phương trình điều kiện dinh dưỡng.

---

## 1. Thiết lập hệ bất phương trình
Gọi $x$ là số kilôgam thức ăn loại X cần mua ($x \\ge 0$).
Gọi $y$ là số kilôgam thức ăn loại Y cần mua ($y \\ge 0$).

Dựa vào yêu cầu dinh dưỡng tối thiểu:
- Lượng Vitamin A tối thiểu là 900 đơn vị:
  $$400x + 300y \\ge 900 \\Leftrightarrow 4x + 3y \\ge 9$$
- Lượng Vitamin B tối thiểu là 600 đơn vị:
  $$200x + 300y \\ge 600 \\Leftrightarrow 2x + 3y \\ge 6$$

Hàm mục tiêu chi phí $T(x, y)$ cần tìm giá trị nhỏ nhất (Min) (đơn vị: nghìn đồng):
$$T(x, y) = 10x + 12y \\longrightarrow \\min$$

Ta có hệ bất phương trình giới hạn:
$$\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 4x + 3y \\ge 9 \\\\ 2x + 3y \\ge 6 \\end{cases}$$

---

## 2. Xác định miền nghiệm hình học
- Vẽ $d_1: 4x + 3y = 9$ đi qua $(2.25; 0)$ và $(0; 3)$. Thử $O(0; 0) \\Rightarrow 0 \\ge 9$ (SAI), gạch bỏ nửa mặt phẳng chứa $O$.
- Vẽ $d_2: 2x + 3y = 6$ đi qua $(3; 0)$ và $(0; 2)$. Thử $O(0; 0) \\Rightarrow 0 \\ge 6$ (SAI), gạch bỏ nửa mặt phẳng chứa $O$.
- Kết hợp với $x \\ge 0, y \\ge 0$.

Miền nghiệm của hệ là miền không bị gạch (miền đa giác không bị chặn) có 3 đỉnh biên:
- Đỉnh $A(3; 0)$ trên trục hoành $Ox$.
- Đỉnh $C(0; 3)$ trên trục tung $Oy$.
- Đỉnh $B(1.5; 1)$ là giao điểm của $d_1$ và $d_2$, nghiệm của hệ:
  $$\\begin{cases} 4x + 3y = 9 \\\\ 2x + 3y = 6 \\end{cases} \\Rightarrow \\begin{cases} 2x = 3 \\\\ y = 1 \\end{cases} \\Rightarrow B(1.5; 1)$$

---

## 3. Tính toán chi phí tại các đỉnh

Thay tọa độ các đỉnh vào hàm chi phí $T(x, y) = 10x + 12y$ (đơn vị: nghìn đồng):

| Đỉnh đa giác | Tọa độ $(x; y)$ | Biểu thức tính $T(x, y)$ | Giá trị $T(x, y)$ (nghìn đồng) |
| :---: | :---: | :--- | :---: |
| **$A$** | $(3; 0)$ | $10(3) + 12(0)$ | $30$ |
| **$B$** | $(1.5; 1)$ | $10(1.5) + 12(1) = 15 + 12$ | **$27$ (Nhỏ nhất)** |
| **$C$** | $(0; 3)$ | $10(0) + 12(3)$ | $36$ |

## 4. Kết luận

Bài toán giải quyết trường hợp thực tế kinh điển: **Hàm mục tiêu không đạt được tại đỉnh đa giác miền nghiệm** do các đỉnh có tọa độ không nguyên, trong khi điều kiện thực tế bắt buộc số lượng sản phẩm phải là số tự nhiên ($x, y \\in \\mathbb{N}$).

---

## 1. Thiết lập bài toán toán học
Gọi $x$ là số tượng loại A xưởng sản xuất trong một tuần ($x \\ge 0, x \\in \\mathbb{N}$).  
Gọi $y$ là số tượng loại B xưởng sản xuất trong một tuần ($y \\ge 0, y \\in \\mathbb{N}$).

Theo giả thiết về nguồn lực giới hạn của cơ sở:
- **Thời gian tiện gỗ tối đa 17 giờ:**
  $$2x + 3y \\le 17$$
- **Thời gian hoàn thiện tối đa 16 giờ:**
  $$3x + 2y \\le 16$$

Tổng số tiền lãi hàng tuần thu được biểu diễn qua hàm mục tiêu $F(x, y)$ (đơn vị: triệu đồng):
$$F(x, y) = 4x + 5y \\longrightarrow \\max$$

Hệ bất phương trình ràng buộc:
$$\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 2x + 3y \\le 17 \\\\ 3x + 2y \\le 16 \\\\ x, y \\in \\mathbb{N} \\end{cases}$$

---

## 2. Xác định miền nghiệm hình học trên mặt phẳng $Oxy$
- $x \\ge 0$: Nửa mặt phẳng bên phải trục tung $Oy$. Gạch bỏ phần $x < 0$.
- $y \\ge 0$: Nửa mặt phẳng phía trên trục hoành $Ox$. Gạch bỏ phần $y < 0$.
- Đường thẳng biên $d_1: 2x + 3y = 17$ (nét liền) đi qua $(8{,}5; 0)$ và $(0; 5{,}67)$. Thử gốc $O(0; 0)$ thỏa mãn, gạch bỏ phần không chứa $O$.
- Đường thẳng biên $d_2: 3x + 2y = 16$ (nét liền) đi qua $(5{,}33; 0)$ và $(0; 8)$. Thử gốc $O(0; 0)$ thỏa mãn, gạch bỏ phần không chứa $O$.

Miền nghiệm của hệ là miền tứ giác $OABC$ (kể cả biên) với tọa độ các đỉnh:
- Đỉnh **$O(0; 0)$** (gốc tọa độ)
- Đỉnh **$A(\\frac{16}{3}; 0) \\approx A(5{,}33; 0)$** (giao điểm của $d_2$ với trục $Ox$)
- Đỉnh **$C(0; \\frac{17}{3}) \\approx C(0; 5{,}67)$** (giao điểm của $d_1$ với trục $Oy$)
- Đỉnh **$B(2{,}8; 3{,}8)$** là giao điểm của hai đường thẳng $d_1$ và $d_2$:
  $$\\begin{cases} 2x + 3y = 17 \\\\ 3x + 2y = 16 \\end{cases} \\Rightarrow \\begin{cases} x = \\frac{14}{5} = 2{,}8 \\\\ y = \\frac{19}{5} = 3{,}8 \\end{cases}$$

---

## 3. Tính giá trị hàm mục tiêu tại các đỉnh đa giác (Phương án liên tục)

Thay tọa độ các đỉnh vào hàm mục tiêu $F(x, y) = 4x + 5y$ (triệu đồng):

| Đỉnh đa giác | Tọa độ $(x; y)$ | Biểu thức tính $F(x, y)$ | Giá trị $F(x, y)$ (triệu đồng) |
| :---: | :---: | :--- | :---: |
| **$O$** | $(0; 0)$ | $4(0) + 5(0)$ | $0$ |
| **$A$** | $(5{,}33; 0)$ | $4(5{,}33) + 5(0)$ | $21{,}33$ |
| **$C$** | $(0; 5{,}67)$ | $4(0) + 5(5{,}67)$ | $28{,}33$ |
| **$B$** | $(2{,}8; 3{,}8)$ | $4(2{,}8) + 5(3{,}8)$ | **$30{,}2$ (Lớn nhất liên tục)** |

> ⚠️ **Nhận xét quan trọng:** Điểm đem lại giá trị liên tục lớn nhất là đỉnh **$B(2{,}8; 3{,}8)$** với $F = 30{,}2$ triệu đồng. Tuy nhiên, hoành độ $x = 2{,}8$ và tung độ $y = 3{,}8$ **không phải là các số tự nhiên**. Cơ sở không thể sản xuất lẻ $2{,}8$ hoặc $3{,}8$ bức tượng. Do điều kiện ẩn $x, y \\in \\mathbb{N}$, giá trị tối ưu thực tế **không đạt được tại đỉnh đa giác này**.

## 4. Sàng lọc các điểm có tọa độ nguyên trong miền nghiệm ($x, y \\in \\mathbb{N}$)

Nhiệm vụ của ta là phải **sàng lọc** các điểm có tọa độ nguyên $(x; y) \\in \\mathbb{N}^2$ nằm bên trong hoặc trên cạnh của đa giác miền nghiệm $OABC$:

Vì $0 \\le y \\le 5{,}67$ và $y \\in \\mathbb{N}$, nên $y \\in \\{0; 1; 2; 3; 4; 5\\}$. Với mỗi giá trị $y$, ta tìm các số tự nhiên $x \\ge 0$ thỏa mãn đồng thời $2x \\le 17 - 3y$ và $3x \\le 16 - 2y$:
- Khi $y = 5$: $2x \\le 2 \\Rightarrow x \\le 1$. Các điểm nguyên: $(0; 5), (1; 5)$.
- Khi $y = 4$: $2x \\le 5 \\Rightarrow x \\le 2$. Các điểm nguyên: $(0; 4), (1; 4), (2; 4)$.
- Khi $y = 3$: $3x \\le 10 \\Rightarrow x \\le 3$. Các điểm nguyên: $(0; 3), (1; 3), (2; 3), (3; 3)$.
- Khi $y = 2$: $3x \\le 12 \\Rightarrow x \\le 4$. Các điểm nguyên: $(0; 2), \\dots, (4; 2)$.
- Khi $y = 1$: $3x \\le 14 \\Rightarrow x \\le 4$. Các điểm nguyên: $(0; 1), \\dots, (4; 1)$.
- Khi $y = 0$: $3x \\le 16 \\Rightarrow x \\le 5$. Các điểm nguyên: $(0; 0), \\dots, (5; 0)$.

Bảng tính giá trị của hàm mục tiêu $F(x, y) = 4x + 5y$ tại các điểm nguyên ứng cử viên cận trên:

| Tọa độ điểm nguyên $(x; y)$ | Vị trí trong miền nghiệm | Biểu thức tính $F(x, y)$ | Giá trị $F(x, y)$ (triệu đồng) | Đánh giá |
| :---: | :---: | :--- | :---: | :---: |
| $(0; 5)$ | Trong miền nghiệm | $4(0) + 5(5)$ | $25$ | |
| **$(1; 5)$** | **Trên bờ $d_1$** ($2\\cdot 1 + 3\\cdot 5 = 17$) | $4(1) + 5(5) = 4 + 25$ | **$29$** | ⭐ **Giá trị lớn nhất (Max)** |
| $(2; 4)$ | Trong miền nghiệm | $4(2) + 5(4) = 8 + 20$ | $28$ | |
| $(3; 3)$ | Trong miền nghiệm | $4(3) + 5(3) = 12 + 15$ | $27$ | |
| $(4; 2)$ | Trên bờ $d_2$ ($3\\cdot 4 + 2\\cdot 2 = 16$) | $4(4) + 5(2) = 16 + 10$ | $26$ | |
| $(5; 0)$ | Trong miền nghiệm | $4(5) + 5(0)$ | $20$ | |
