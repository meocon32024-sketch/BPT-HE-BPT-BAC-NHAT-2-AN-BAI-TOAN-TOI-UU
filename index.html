Phương pháp giải tuân thủ 100% quy chuẩn 3 bước trong **Sách giáo khoa Toán 10 - Kết nối tri thức với cuộc sống** (Chương II, Bài 3):

---

## Bước 1: Vẽ đường thẳng bờ $d$

Vẽ đường thẳng $d: 2x - y = 4$ trên mặt phẳng tọa độ $Oxy$.
- Cho $y = 0 \\Rightarrow 2x = 4 \\Rightarrow x = 2$. Đường thẳng $d$ cắt trục hoành $Ox$ tại điểm $P(2; 0)$.
- Cho $x = 0 \\Rightarrow -y = 4 \\Rightarrow y = -4$. Đường thẳng $d$ cắt trục tung $Oy$ tại điểm $Q(0; -4)$.

> ⚠️ **Quy ước nét vẽ SGK KNTT:** Do bất phương trình có dấu so sánh ngặt "$<$" (không lấy dấu bằng), đường thẳng bờ $d$ phải được vẽ bằng **nét đứt**.

---

## Bước 2: Chọn điểm thử

Chọn gốc tọa độ $O(0; 0)$ làm điểm thử (vì điểm $O$ không nằm trên đường thẳng $d$).
- Thay tọa độ $(0; 0)$ vào vế trái của bất phương trình:
  $$2(0) - (0) = 0$$
- So sánh với vế phải: Ta thấy $0 < 4$ là một khẳng định **ĐÚNG**.

---

## Bước 3: Kết luận miền nghiệm

- Miền nghiệm của bất phương trình $2x - y < 4$ là nửa mặt phẳng có bờ là đường thẳng $d: 2x - y = 4$, **chứa gốc tọa độ $O(0; 0)$** và **không kể bờ $d$** (đường nét đứt).
- **Quy ước gạch bỏ trên đồ thị:** Gạch bỏ nửa mặt phẳng không chứa gốc tọa độ $O(0; 0)$. Phần mặt phẳng không bị gạch chính là miền nghiệm của bất phương trình.`},{id:`sample-2`,title:`2. Hệ bất phương trình bậc nhất hai ẩn`,subtitle:`Ví dụ 2 (Trang 25, SGK Toán 10 KNTT)`,description:`Xác định và biểu diễn miền nghiệm của hệ bất phương trình tạo thành miền đa giác lồi.`,prompt:`Xác định và biểu diễn miền nghiệm của hệ bất phương trình bậc nhất hai ẩn sau trên mặt phẳng tọa độ Oxy:

## 1. Hệ bất phương trình giới hạn
Xét hệ bất phương trình bậc nhất hai ẩn:
$$\\begin{cases} x + y \\le 5 \\\\ x + 2y \\le 8 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$$

## 2. Biểu diễn miền nghiệm trên mặt phẳng tọa độ $Oxy$
- Vẽ các đường thẳng bờ trên mặt phẳng tọa độ $Oxy$:
  - Đường thẳng $d_1: x + y = 5$ đi qua hai điểm $(5; 0)$ và $(0; 5)$.
  - Đường thẳng $d_2: x + 2y = 8$ đi qua hai điểm $(8; 0)$ và $(0; 4)$.
  - Bờ $x = 0$ là trục tung $Oy$; bờ $y = 0$ là trục hoành $Ox$.
- Lần lượt gạch bỏ các nửa mặt phẳng không phải là miền nghiệm của từng bất phương trình trong hệ.
- Miền nghiệm của hệ là miền không bị gạch trên mặt phẳng tọa độ $Oxy$.

Đó là miền tứ giác **$OABC$** (kể cả biên), với tọa độ các đỉnh:
- Đỉnh **$O$**: $(0; 0)$ (gốc tọa độ)
- Đỉnh **$A$**: $(5; 0)$
- Đỉnh **$B$**: $(2; 3)$ (giao điểm của $d_1$ và $d_2$)
- Đỉnh **$C$**: $(0; 4)$`},{id:`sample-3`,title:`3. Bài toán Sản xuất (Tối ưu lợi nhuận)`,subtitle:`Bài toán thực tế kinh điển (SGK Toán 10 KNTT)`,description:`Quy hoạch tuyến tính tối ưu số lượng sản phẩm để đạt doanh thu và lợi nhuận cao nhất.`,prompt:`Một xưởng sản xuất bàn và ghế. Để sản xuất 1 chiếc bàn cần 2 giờ lắp ráp và 1 giờ hoàn thiện. Để sản xuất 1 chiếc ghế cần 1 giờ lắp ráp và 1 giờ hoàn thiện. Tổng số giờ lắp ráp tối đa mỗi tuần là 40 giờ, giờ hoàn thiện tối đa là 25 giờ. Biết một chiếc bàn bán lãi 200.000 đồng, một chiếc ghế bán lãi 150.000 đồng. Hãy lập kế hoạch sản xuất bàn và ghế sao cho tổng số tiền lãi lớn nhất.`,inequalities:[{a:1,b:0,sign:`>=`,c:0,isStrict:!1,label:`x >= 0`},{a:0,b:1,sign:`>=`,c:0,isStrict:!1,label:`y >= 0`},{a:2,b:1,sign:`<=`,c:40,isStrict:!1,label:`d_1: 2x + y = 40`},{a:1,b:1,sign:`<=`,c:25,isStrict:!1,label:`d_2: x + y = 25`}],objectiveFunction:{f_a:200,f_b:150,isMax:!0,symbol:`Lợi nhuận F(x,y)`},vertices:[{x:0,y:0,label:`O`},{x:20,y:0,label:`A`},{x:15,y:10,label:`B`},{x:0,y:25,label:`C`}],suggestedBounds:{xMin:-5,xMax:30,yMin:-5,yMax:35},explanation:`# Bài toán tối ưu sản xuất (Quy hoạch tuyến tính)

Dưới đây là lời giải chi tiết theo đúng các bước phương pháp sư phạm **SGK Toán 10 Kết nối tri thức**:

---

## 1. Thiết lập bài toán toán học
Gọi $x$ là số lượng chiếc bàn xưởng sản xuất trong một tuần ($x \\ge 0$).
Gọi $y$ là số lượng chiếc ghế xưởng sản xuất trong một tuần ($y \\ge 0$).

Các điều kiện giới hạn nguồn lực của xưởng:
- **Thời gian lắp ráp tối đa là 40 giờ:**
  $$2x + y \\le 40$$
- **Thời gian hoàn thiện tối đa là 25 giờ:**
  $$x + y \\le 25$$

Tổng lợi nhuận thu được hàng tuần biểu diễn qua hàm mục tiêu $F(x, y)$ (đơn vị: nghìn đồng):
$$F(x, y) = 200x + 150y$$

Ta cần tìm giá trị lớn nhất của $F(x, y)$ với các điều kiện ràng buộc:
$$\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 2x + y \\le 40 \\\\ x + y \\le 25 \\end{cases}$$

---

## 2. Xác định miền nghiệm của hệ bất phương trình
- $x \\ge 0$: Nửa mặt phẳng bên phải trục tung $Oy$. Gạch bỏ phần $x < 0$.
- $y \\ge 0$: Nửa mặt phẳng phía trên trục hoành $Ox$. Gạch bỏ phần $y < 0$.
- $2x + y \\le 40$: Vẽ đường thẳng $d_1: 2x + y = 40$ (nét liền) đi qua $(20; 0)$ và $(0; 40)$. Thử gốc $O(0; 0)$ thỏa mãn, gạch bỏ phần không chứa $O$.
- $x + y \\le 25$: Vẽ đường thẳng $d_2: x + y = 25$ (nét liền) đi qua $(25; 0)$ và $(0; 25)$. Thử gốc $O(0; 0)$ thỏa mãn, gạch bỏ phần không chứa $O$.

**Kết luận miền nghiệm:** Miền nghiệm của hệ là miền tứ giác lồi **$OABC$** (phần mặt phẳng không bị gạch).

---

## 3. Tọa độ các đỉnh của tứ giác nghiệm $OABC$
- $O(0; 0)$ là gốc tọa độ.
- $A(20; 0)$ là giao điểm của $d_1$ với trục hoành $Ox$.
- $C(0; 25)$ là giao điểm của $d_2$ với trục tung $Oy$.

---

## 4. Tính giá trị hàm mục tiêu tại các đỉnh

Thay tọa độ các đỉnh của miền tứ giác $OABC$ vào hàm mục tiêu $F(x, y) = 200x + 150y$ (đơn vị: nghìn đồng):

| Đỉnh đa giác | Tọa độ $(x; y)$ | Biểu thức tính $F(x, y)$ | Giá trị $F(x, y)$ (nghìn đồng) |

| **$O$** | $(0; 0)$ | $200(0) + 150(0)$ | $0$ |
| **$A$** | $(20; 0)$ | $200(20) + 150(0)$ | $4,000$ |
| **$C$** | $(0; 25)$ | $200(0) + 150(25)$ | $3,750$ |
| **$B$** | $(15; 10)$ | $200(15) + 150(10)$ | **$4,500$ (Lớn nhất)** |

## 5. Kết luận thực tế

Bài toán tìm giá trị nhỏ nhất (Min) của chi phí dựa trên hệ bất phương trình điều kiện dinh dưỡng.

---

## 1. Thiết lập hệ bất phương trình
Gọi $x$ là số kilôgam thức ăn loại X cần mua ($x \\ge 0$).
Gọi $y$ là số kilôgam thức ăn loại Y cần mua ($y \\ge 0$).

Dựa vào yêu cầu dinh dưỡng tối thiểu:
- Lượng Vitamin A tối thiểu là 900 đơn vị:
  $$400x + 300y \\ge 900 \\Leftrightarrow 4x + 3y \\ge 9$$
- Lượng Vitamin B tối thiểu là 600 đơn vị:
  $$200x + 300y \\ge 600 \\Leftrightarrow 2x + 3y \\ge 6$$

Hàm mục tiêu chi phí $T(x, y)$ cần tìm giá trị nhỏ nhất (Min) (đơn vị: nghìn đồng):
$$T(x, y) = 10x + 12y \\longrightarrow \\min$$

Ta có hệ bất phương trình giới hạn:

- Vẽ $d_2: 2x + 3y = 6$ đi qua $(3; 0)$ và $(0; 2)$. Thử $O(0; 0) \\Rightarrow 0 \\ge 6$ (SAI), gạch bỏ nửa mặt phẳng chứa $O$.
- Kết hợp với $x \\ge 0, y \\ge 0$.

Miền nghiệm của hệ là miền không bị gạch (miền đa giác không bị chặn) có 3 đỉnh biên:
- Đỉnh $A(3; 0)$ trên trục hoành $Ox$.
- Đỉnh $C(0; 3)$ trên trục tung $Oy$.
- Đỉnh $B(1.5; 1)$ là giao điểm của $d_1$ và $d_2$, nghiệm của hệ:
  $$\\begin{cases} 4x + 3y = 9 \\\\ 2x + 3y = 6 \\end{cases} \\Rightarrow \\begin{cases} 2x = 3 \\\\ y = 1 \\end{cases} \\Rightarrow B(1.5; 1)$$

---

## 3. Tính toán chi phí tại các đỉnh

Thay tọa độ các đỉnh vào hàm chi phí $T(x, y) = 10x + 12y$ (đơn vị: nghìn đồng):

| Đỉnh đa giác | Tọa độ $(x; y)$ | Biểu thức tính $T(x, y)$ | Giá trị $T(x, y)$ (nghìn đồng) |
| :---: | :---: | :--- | :---: |
| **$A$** | $(3; 0)$ | $10(3) + 12(0)$ | $30$ |
| **$B$** | $(1.5; 1)$ | $10(1.5) + 12(1) = 15 + 12$ | **$27$ (Nhỏ nhất)** |
| **$C$** | $(0; 3)$ | $10(0) + 12(3)$ | $36$ |

<!-- ĐOẠN MÃ TẮT TÍNH NĂNG AI & XUẤT FILE AN TOÀN -->
<style>
  [data-thay-thang-hide="true"] {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
    width: 0 !important;
    height: 0 !important;
    overflow: hidden !important;
    position: absolute !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
  }
</style>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    let scanTimeout;
    const observer = new MutationObserver(() => {
      clearTimeout(scanTimeout);
      // Quét với độ trễ 50ms để đợi React vẽ xong giao diện
      scanTimeout = setTimeout(() => {
        try {
          const walker = document.createTreeWalker(document.documentElement, NodeFilter.SHOW_TEXT, null, false);
          let node;
          while (node = walker.nextNode()) {
            const text = node.nodeValue || '';
            
            // 1. Tắt 2 phím ở Header & Menu
            if (text.includes('Chụp/Nhập Đề Bằng AI') || text.includes('Xuất file HTML')) {
              const targetBtn = node.parentElement.closest('button, a, div[role="button"], .btn') || node.parentElement;
              if (targetBtn && !targetBtn.hasAttribute('data-thay-thang-hide')) {
                targetBtn.setAttribute('data-thay-thang-hide', 'true');
              }
            }

            // 2. Tắt toàn bộ Form nhập/chụp đề AI
            if (text.includes('Nhập đề bài tùy chỉnh hoặc chụp ảnh')) {
              const targetForm = node.parentElement.closest('form');
              if (targetForm && !targetForm.hasAttribute('data-thay-thang-hide')) {
                // Gắn nhãn để CSS làm tàng hình Form
                targetForm.setAttribute('data-thay-thang-hide', 'true');
                
                // Ẩn luôn vùng chứa (bao gồm cả phần chọn dạng toán mẫu phía trên Form) để dọn sạch UI
                if (targetForm.parentElement && targetForm.parentElement.tagName === 'DIV') {
                  targetForm.parentElement.setAttribute('data-thay-thang-hide', 'true');
                }
              }
            }
          }
        } catch (e) {}
      }, 50); 
    });
    
    // Theo dõi toàn bộ trang để bắt sự kiện khi React cập nhật UI
    observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  });
</script>
<!-- ĐOẠN MÃ TÙY CHỈNH GIAO DIỆN (ẨN TÍNH NĂNG & ĐỔI TÊN) -->
<style>
  /* 1. Class làm tàng hình các nút/bảng AI */
  [data-thay-thang-hide="true"] {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
    width: 0 !important;
    height: 0 !important;
    overflow: hidden !important;
    position: absolute !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
  }
  
  /* 2. Class màu xanh sang trọng cho tên Giáo viên */
  .thay-thang-signature {
    color: #1d4ed8; /* Màu xanh Royal Blue hoàng gia */
    font-weight: 900;
    text-shadow: 0px 2px 4px rgba(29, 78, 216, 0.25);
    white-space: nowrap; /* Chống rớt dòng tên thầy */
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    let scanTimeout;
    const observer = new MutationObserver(() => {
      clearTimeout(scanTimeout);
      // Quét với độ trễ 50ms để đợi React vẽ xong giao diện
      scanTimeout = setTimeout(() => {
        try {
          // --- YÊU CẦU 1: THÊM TÊN THẦY THẮNG VÀO TIÊU ĐỀ ---
          const h1Elements = document.querySelectorAll('h1');
          h1Elements.forEach(h1 => {
            const text = h1.textContent || '';
            if (text.includes('Giải Bất Phương Trình, Hệ Bất Phương Trình & Quy Hoạch Tuyến Tính') && 
               !text.includes('MAI ĐỨC THẮNG')) {
              // Cập nhật lại HTML của thẻ H1
              h1.innerHTML = 'Giải Bất Phương Trình, Hệ Bất Phương Trình & Quy Hoạch Tuyến Tính <span class="thay-thang-signature">/ GV MAI ĐỨC THẮNG</span>';
            }
          });

          // --- YÊU CẦU 2: ẨN NÚT VÀ BẢNG NHẬP AI ---
          const walker = document.createTreeWalker(document.documentElement, NodeFilter.SHOW_TEXT, null, false);
          let node;
          while (node = walker.nextNode()) {
            const text = node.nodeValue || '';
            
            // Ẩn 2 phím ở Header & Menu
            if (text.includes('Chụp/Nhập Đề Bằng AI') || text.includes('Xuất file HTML')) {
              const targetBtn = node.parentElement.closest('button, a, div[role="button"], .btn') || node.parentElement;
              if (targetBtn && !targetBtn.hasAttribute('data-thay-thang-hide')) {
                targetBtn.setAttribute('data-thay-thang-hide', 'true');
              }
            }

            // Ẩn toàn bộ Form nhập/chụp đề AI
            if (text.includes('Nhập đề bài tùy chỉnh hoặc chụp ảnh')) {
              const targetForm = node.parentElement.closest('form');
              if (targetForm && !targetForm.hasAttribute('data-thay-thang-hide')) {
                targetForm.setAttribute('data-thay-thang-hide', 'true');
                if (targetForm.parentElement && targetForm.parentElement.tagName === 'DIV') {
                  targetForm.parentElement.setAttribute('data-thay-thang-hide', 'true');
                }
              }
            }
          }
        } catch (e) {}
      }, 50); 
    });
    
    // Bật theo dõi sự thay đổi của giao diện
    observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  });
</script>
